name = "laap-api"
main = "src/worker.ts"
compatibility_date = "2024-01-01"

# 环境变量
[vars]
JWT_SECRET = "laap-secret-key-2026"
API_VERSION = "2.0.0"

# KV 存储（替代内存数据库）
[[kv_namespaces]]
binding = "LAAP_DB"
id = "your-kv-namespace-id"

# 路由配置
[env.production]
vars = { API_VERSION = "2.0.0" }

# 自定义域名
[[routes]]
pattern = "api.laap.cn/*"
custom_domain = true