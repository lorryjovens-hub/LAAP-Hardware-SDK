<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="deviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="senseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#0f172a" rx="16"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="white" font-size="20" font-weight="bold">LAAP Hardware SDK 架构</text>
  
  <!-- Central Brain -->
  <rect x="250" y="60" width="300" height="80" rx="12" fill="url(#brainGrad)" opacity="0.9"/>
  <text x="400" y="95" text-anchor="middle" fill="white" font-size="16" font-weight="bold">🧠 LAAP 中央大脑</text>
  <text x="400" y="118" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">PSI 循环 · 记忆 · 世界模型</text>
  
  <!-- Connection lines -->
  <line x1="300" y1="140" x2="180" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="140" x2="400" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="140" x2="620" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Host Adapters -->
  <rect x="80" y="210" width="180" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="170" y="240" text-anchor="middle" fill="white" font-size="13" font-weight="600">💻 桌面宿主</text>
  <text x="170" y="260" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="10">Windows / macOS</text>
  
  <rect x="310" y="210" width="180" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="240" text-anchor="middle" fill="white" font-size="13" font-weight="600">📱 手机宿主</text>
  <text x="400" y="260" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="10">Android / iOS</text>
  
  <rect x="540" y="210" width="180" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="630" y="240" text-anchor="middle" fill="white" font-size="13" font-weight="600">☁️ 云电脑</text>
  <text x="630" y="260" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="10">AWS / 阿里云</text>
  
  <!-- Channel -->
  <rect x="150" y="310" width="500" height="50" rx="10" fill="url(#deviceGrad)" opacity="0.9"/>
  <text x="400" y="342" text-anchor="middle" fill="white" font-size="14" font-weight="bold">⚡ 意识流帧穿行通道</text>
  
  <!-- Connection lines -->
  <line x1="170" y1="280" x2="200" y2="310" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="280" x2="400" y2="310" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="280" x2="600" y2="310" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Devices -->
  <rect x="50" y="390" width="150" height="70" rx="10" fill="url(#senseGrad)" opacity="0.9"/>
  <text x="125" y="420" text-anchor="middle" fill="white" font-size="12" font-weight="bold">👁 感知</text>
  <text x="125" y="440" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">摄像头/麦克风/传感器</text>
  
  <rect x="230" y="390" width="150" height="70" rx="10" fill="url(#senseGrad)" opacity="0.9"/>
  <text x="305" y="420" text-anchor="middle" fill="white" font-size="12" font-weight="bold">✋ 执行</text>
  <text x="305" y="440" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">继电器/LED/马达</text>
  
  <rect x="410" y="390" width="150" height="70" rx="10" fill="url(#senseGrad)" opacity="0.9"/>
  <text x="485" y="420" text-anchor="middle" fill="white" font-size="12" font-weight="bold">🧠 认知</text>
  <text x="485" y="440" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">本地推理/模式识别</text>
  
  <rect x="590" y="390" width="150" height="70" rx="10" fill="url(#senseGrad)" opacity="0.9"/>
  <text x="665" y="420" text-anchor="middle" fill="white" font-size="12" font-weight="bold">🌍 世界</text>
  <text x="665" y="440" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">环境感知/因果推理</text>
  
  <!-- Connection lines -->
  <line x1="200" y1="360" x2="125" y2="390" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="360" x2="305" y2="390" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="360" x2="485" y2="390" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="360" x2="665" y2="390" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Labels -->
  <text x="400" y="485" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11">LAAP Hardware SDK v1.0.0 | 让硬件拥有生命</text>
</svg>