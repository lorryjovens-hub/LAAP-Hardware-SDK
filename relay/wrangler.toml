name = "laap-relay"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Durable Objects：按 user_id 分片的 WebSocket 会合点
[[durable_objects.bindings]]
name = "LAAP_HUB"
class_name = "LAAPHubRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LAAPHubRoom"]

[vars]
ENVIRONMENT = "production"

# 路由到 api.laap.cn/ws
# 注意：需要先在 Cloudflare 面板把这个 Worker 绑定到 api.laap.cn 这个域名

[observability]
enabled = true

# 注意：JWT_SECRET 不要写在这里，用 secret 命令设置：
#   wrangler secret put JWT_SECRET
